}
function applyOutputDiagnosticSnapshot(value){
  if(!value||typeof value!=='object') return;
  let changed=false;
  for(const key of ['fps','displayInfo','testCard']){
    if(Object.prototype.hasOwnProperty.call(value,key)&&outFlags[key]!==!!value[key]){
      outFlags[key]=!!value[key]; changed=true;
    }
  }
  if(!changed) return;
  persistOutputDiagnostics();
  if(editor.flags&&editor.flags.testCard!==outFlags.testCard)
    editor.setFlag('testCard',outFlags.testCard);
  pushOutputFlags();
}
try{
  if(typeof BroadcastChannel==='function'){
    outputDiagnosticChannel=new BroadcastChannel('openlive-output-diagnostics-v1');
    outputDiagnosticChannel.addEventListener('message',event=>applyOutputDiagnosticSnapshot(event.data));
    addEventListener('pagehide',()=>outputDiagnosticChannel&&outputDiagnosticChannel.close(),{once:true});
  }
}catch(error){ outputDiagnosticChannel=null; }
/* Identify Displays numbers each surface, so it is per-window rather than a
   single boolean: "the numbers will match the numbers your computer has
   assigned to those monitors" (output-setup.htm). */
function toggleIdentify(){
  const on = !outFlags.identify;
  outFlags.identify = on ? 1 : 0;
  let n = 0;
  for(const {win} of openWindows.values()){
    n++;
    try { if(win && !win.closed && win.__openliveOutputFlags) win.__openliveOutputFlags.identify = on ? n : 0; }
    catch(e){}
  }
  msg(on ? 'Identifying ' + n + ' output' + (n===1?'':'s') : 'Identify off');
  return on;
}
const OUTPUT_CHK = { outFPS:'fps', outInfo:'displayInfo' };

function resolveMenu(items){
  const liveOutputCount = activeOutputIds().length;
  return (items||[]).map(it => {
    if(it.sep) return it;
    const o = Object.assign({}, it);
    /* File's items are written here with real handlers already; resolving is
       only for the decoded trees that arrive without any. */
    if(o.fn) return o;

    /* the fictional three-display list the capture froze in — replaced with
       whatever this machine actually reports (openlive-displays.js) */
    if(o.l === 'Fullscreen' || o.l === 'Windowed'){
      const mode = o.l === 'Windowed' ? 'windowed' : 'fullscreen';
      const DS = window.OpenLiveDisplays;
      const ds = hostDisplays || ((DS && DS.list && DS.list()) || []);
      o.sub = ds.length ? ds.map((d, i) => ({
        l: d.label || d.name || ('Display ' + (i + 1)),
        dis: d.blocked ? 1 : 0,
        /* The tick means "the SELECTED screen is on this display", because
           that is what clicking here would toggle. A different screen owning
           the display is a different fact and is stated in the tooltip. */
        on: (() => { const e = openWindows.get(currentScreenId());
                     return (e && e.win && !e.win.closed && e.mode === mode && e.index === i) ? 1 : 0; })(),
        /* output-setup.htm: Fullscreen fills the display; Windowed "just fills
           the second output with a rectangle exactly the size of your
           composition". The screen presented is whichever one the editor has
           selected, which is what the user is looking at. */
        title: d.blocked ? (d.reason || 'This display cannot be measured yet.') : (mode === 'windowed'
          ? 'Open this screen on ' + (d.label || 'this display') + ' at Show size.'
          : 'Present this screen fullscreen on ' + (d.label || 'this display') + '. Click the new window once to enter fullscreen.'),
        fn: d.blocked ? null : () => present(mode, i, d)
      })) : [{ l:'No displays reported', dis:1,
               title:'The Window Management permission has not been granted, so only this window’s own display is visible to the page. Open the Output menu again after granting it.' }];
      return o;
    }
    if(o.sub){ o.sub = resolveMenu(o.sub); return o; }

    const why = MENU_CANNOT[o.l];
    if(why){ o.dis = 1; o.title = why; return o; }

    /* Output > Disabled is the same state as the toolbar's output toggle */
    if(o.l === 'Disabled' && o.radio === 'outMode'){
      o.on = FLG().outputOff ? 1 : 0;
      o.fn = () => editor.setFlag('outputOff', !FLG().outputOff);
      return o;
    }
    /* Identify Displays — numbers every open output surface. */
    if(o.l === 'Identify Displays'){
      if(!liveOutputCount){ o.dis = 1; o.title = 'No output is open to identify. Present a screen first.'; return o; }
      o.on = outFlags.identify ? 1 : 0;
      o.title = 'Overlay each open output with its number and a colour.';
      o.fn = toggleIdentify;
      return o;
    }
    /* Overlays drawn ON the output. Arena lets these be armed before a Screen
       is presented; every later output inherits the same authoritative flag. */
    if(o.chk && OUTPUT_CHK[o.chk]){
      const k = OUTPUT_CHK[o.chk];
      o.on = outFlags[k] ? 1 : 0;
      o.title = liveOutputCount
        ? 'Drawn onto every open output.'
        : 'Armed now and drawn onto every output opened later.';
      o.fn = () => toggleOutputFlag(k);
      return o;
    }
    if(o.chk){
      const flag = MENU_CHK[o.chk];
      if(flag){
        o.on = flag==='testCard' ? (outFlags.testCard?1:0) : (FLG()[flag]?1:0);
        /* Test Card belongs to both: the editor's own preview and every open
           output surface, so one tick drives both rather than disagreeing. */
        o.fn = () => flag==='testCard'
          ? setOutputFlag('testCard',!outFlags.testCard)
          : editor.setFlag(flag,!FLG()[flag]);
      }
      else { o.dis = 1; o.title = o.title || 'Not served by this window.'; }
      return o;
    }
    if(o.act && MENU_ACTS[o.act]){ o.fn = MENU_ACTS[o.act]; return o; }

    /* Anything still unmapped is a deck action with no meaning here — the
       Shortcuts editors, the Help pages — so it says so rather than pretending. */
    o.dis = 1;
    o.title = o.title || 'This item belongs to the main SHOWAVE Live window.';
    return o;
  });
}

/* The View menu in the capture is the deck's panel list, none of which exists
   here. This window's view state is its own, so the menu is rebuilt from the
   editor's real flags — the same toggles as the toolbar, which is what makes it
   a second surface onto one state rather than a separate control. */
const VIEW_MENU = { label:'View', items(){
  const f = FLG();
  const tog = (l, k, key) => ({ l, k, on: f[key] ? 1 : 0, fn: () => editor.setFlag(key, !FLG()[key]) });
  return [
    tog('Snap', null, 'snap'),
    tog('Show Slice Grid', null, 'showGrid'),
    tog('Show 8×8 LED Grid', null, 'ledGrid'),
    tog('Identify Slices', null, 'identify'),
    tog('Show Input Guide in Output', null, 'showInOutput'),
    tog('Follow Routing', null, 'followRouting'),
    { sep:1 },
    tog('Show Test Card', 'Ctrl+Shift+L', 'testCard'),
    tog('Disable Output', 'Ctrl+Shift+D', 'outputOff'),
    { sep:1 },
    /* Arena moves BETWEEN Input Selection and Output Transformation; showing
       both at once is this clone's own addition, so it is labelled as one and
       lives here rather than pretending to be a stage tab. */
    { l:'Split Stages (SHOWAVE extension)', on: editor.splitStages() ? 1 : 0,
      fn:()=> editor.splitStages(!editor.splitStages()) },
    { sep:1 },
    { l:'Fit to Window', k:'F', fn:()=>act('fit') }
  ];
}};

const MENU_BAR = [FILE_MENU]
  .concat(['Output'].map(l => (window.MENUS||[]).find(m=>m.label===l)).filter(Boolean))
  .concat([VIEW_MENU])
  .concat(['Shortcuts','Help'].map(l => (window.MENUS||[]).find(m=>m.label===l)).filter(Boolean));

MENU_BAR.forEach(m=>{
  const t=document.createElement('div'); t.className='menu-top';
  t.textContent=window.ShowaveBrand&&window.ShowaveBrand.term
    ? window.ShowaveBrand.term(m.uiLabel??m.label) : (m.uiLabel??m.label);
  t.setAttribute('role','menuitem'); t.setAttribute('aria-haspopup','menu');
  t.setAttribute('aria-expanded','false'); t.tabIndex=0;
  const open=(focusFirst=false)=>{
    closeDD(); menuReturnFocus=t; t.classList.add('open');
    t.setAttribute('aria-expanded','true');
    const r=t.getBoundingClientRect();
    /* resolved per open so every tick is current */
    const items = typeof m.items === 'function' ? m.items() : resolveMenu(m.items);
    buildDD(items,r.left,r.bottom,0,t,focusFirst);
  };
  t.addEventListener('mousedown',e=>{ e.stopPropagation(); t.focus();
    /* THE DISPLAY PERMISSION, ASKED AT THE ONLY MOMENT IT CAN BE.
       getScreenDetails must be called from a user gesture or the prompt is
       suppressed and it silently resolves to the fallback — one entry for this
       window's own display, which is why the Fullscreen submenu has been
       reporting "Display 1 — 0 x 0" instead of the real pair.
       openlive-displays.js:141 names this exact hook: "Wire it to opening the
       Output menu, not to page load." A mousedown on a menu title IS that
       gesture, and Output is the menu that needs the answer. Fire and forget:
       the submenu resolves per open, so the next open shows the real list, and
       a refusal simply leaves the fallback in place. */
    if(m.label === 'Output' && window.OpenLiveDisplays){
      const cur = window.OpenLiveDisplays.permission ? window.OpenLiveDisplays.permission() : 'unknown';
      if(cur === 'unknown' || cur === 'prompt'){
        try { window.OpenLiveDisplays.request(); } catch(err){}
      }
    }
    t.classList.contains('open')?closeDD():open(false); });
  t.addEventListener('mouseenter',()=>{ if(dd.length&&document.querySelector('.menu-top.open')
    &&!t.classList.contains('open')) open(false); });
  t.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '||event.key==='ArrowDown'){
      event.preventDefault(); open(true); return;
    }
    if(event.key==='Escape'){ event.preventDefault(); closeDD(0,true); return; }
    if(event.key==='ArrowRight'||event.key==='ArrowLeft'){
      event.preventDefault();
      const tops=[...document.querySelectorAll('#menus .menu-top')];
      const index=tops.indexOf(t), step=event.key==='ArrowRight'?1:-1;
      const next=tops[(index+step+tops.length)%tops.length];
      closeDD(); if(next) next.focus();
    }
  });
  $('#menus').appendChild(t);
});

/* ---- what this window is showing, in the status bar ---- */
function paintWhere(){
  const screens = setup.screens();
  const slices  = screens.reduce((n, s) => n + (s.layers ? s.layers.length : 0), 0);
  const cs = setup.compositionSize();
  const current = screens.find(s => String(s.uniqueId) ===
    String(editor.state && editor.state.screenId)) || screens[0];
  const raster = current ? deviceRaster(current) : null;
  $('#where').textContent =
    `${screens.length} screen${screens.length === 1 ? '' : 's'} · ` +
    `${slices} slice${slices === 1 ? '' : 's'} · ` +
    `texture ${cs.width} × ${cs.height}` +
    (raster ? ` · output ${raster.width} × ${raster.height}` : '');
}
paintWhere();

/* ---- connection chrome ---- */
function paintConn() {
  const p = $('#conn');
  p.className = 'conn ' + AL.status;
  p.textContent = AL.status === 'live' ? 'LIVE · ' + AL.host()
    : AL.status === 'connecting' ? 'connecting' : 'offline';
  $('#productLine').textContent = AL.status === 'live'
    ? 'SHOWAVE Map: Output Mapping · ' + AL.host() : 'SHOWAVE Map: Output Mapping';
}
AL.on('status', paintConn); paintConn();
$('#conn').addEventListener('click', () => {
  if (AL.status === 'live') return msg('Connected to ' + AL.host());
  const h = prompt('Arena webserver host:port', AL.host());
  if (h) AL.connect(h.trim());
});

/* ---- status + clock, read the same way the main window reads them ---- */
setInterval(() => {
  $('#clock').textContent = new Date().toLocaleTimeString('en-GB').slice(0, 5);
  /* This read the connection backwards: it printed honest dashes while Arena was
     connected and invented CPU / RAM / VRAM / FPS out of Math.random() when it
     was not — so the numbers were fiction precisely when there was nothing to
     measure, and an operator watching "CPU 33%" was watching a random walk. The
     rest of this tree does not do that (panel-kit.js:14, panels/clip.js:10), and
     API-CONTRACT.md is explicit that Arena publishes no telemetry at all. There
     is no number to show, in either state, so none is shown. Real frame rate is
     already on the toolbar, measured from this window's own paint loop. */
  ['cpu','ram','vram','fps'].forEach(k=>{ $(`[data-s=${k}]`).textContent='N/A'; });
  paintFeedPill();
  paintWhere();
}, 500);

addEventListener('beforeunload', () => { try { editor.destroy(); } catch(e){} });
})();
</script>
